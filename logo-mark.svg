<text x="262" y="116" style="font-size:46px;font-family:'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-weight:600;" fill="#FFFFFF">Code<tspan fill="#F2A33D" dx="12">Relay</tspan></text>
